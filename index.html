var SENHA_ACESSO = 'Ephim';

/* Patentes do S.I.I.F — ranking local (localStorage), por jogador, a cada 10 pontos sobe uma patente. */
var PONTOS_POR_PATENTE = 10;
var RANK_TIERS = [
  { title: 'Investigador por Hobby', min: 0 * PONTOS_POR_PATENTE },
  { title: 'Auxiliar de Campo', min: 1 * PONTOS_POR_PATENTE },
  { title: 'Agente Júnior', min: 2 * PONTOS_POR_PATENTE },
  { title: 'Agente de Campo', min: 3 * PONTOS_POR_PATENTE },
  { title: 'Investigador Associado', min: 4 * PONTOS_POR_PATENTE },
  { title: 'Investigador Sênior', min: 5 * PONTOS_POR_PATENTE },
  { title: 'Detetive Nível Bronze', min: 6 * PONTOS_POR_PATENTE },
  { title: 'Detetive Nível Prata', min: 7 * PONTOS_POR_PATENTE },
  { title: 'Detetive Nível Ouro', min: 8 * PONTOS_POR_PATENTE },
  { title: 'Detetive Nível Diamante', min: 9 * PONTOS_POR_PATENTE },
];

var state = {
  screen: 'gate',
  gateInput: '', gateError: '',
  bootLog: [], bootDone: false,
  clock: '',
  regionFilter: 'TODAS',
  mapHoverRegion: '', mapPreviewRegion: null,
  openCaseId: null, activeTab: 'entidade',
  gameType: null, gameCaseIds: [], gameIndex: 0, gamePoints: 0, gameCorrect: 0,
  gameShowedBO: false, gameClueIndex: 1, gameClues: [], gameGuessId: '', gameOptions: [],
  gameFeedback: '', gameFeedbackOk: null, gameFinished: false,
  pinPoint: null, linePoints: null, areaSize: null,

  /* Teste de Campo (Verdadeiro ou Falso) */
  vfIndex: 0, vfTotal: 10, vfScore: 0, vfCurrent: null, vfFeedback: '', vfFeedbackOk: null, vfFinished: false,

  /* Mapeamento de Campo (associar lenda x região) */
  amIndex: 0, amRounds: [], amScore: 0, amAssign: {}, amFeedback: '', amFinished: false,

  /* Detetive de Eliminação */
  detIndex: 0, detTotal: 6, detScore: 0, detFinished: false, detSuspects: [], detTargetId: '',
  detPistas: [], detPistaIndex: 0, detEliminados: {}, detFeedback: '', detFeedbackOk: null, detRoundOver: false,

  /* Reconhecimento Visual */
  rvIndex: 0, rvTotal: 10, rvScore: 0, rvFinished: false, rvCurrent: null, rvFeedback: '', rvFeedbackOk: null,

  /* Modo cronometrado (global) */
  timedMode: false, timeLeft: 0, timeTotal: 0,

  /* Ranking multiplayer — jogador ativo (localStorage) */
  playerName: '',
  playerNameInput: '',
  switchingPlayer: false,

  /* Pontos ganhos na atividade recém-concluída (exibidos no resumo final); se não houver jogador definido, ficam pendentes até o nome ser informado */
  lastPointsGain: 0,
  pendingPoints: 0,
};

var App = {
  state: state,

  /* ---------- utils ---------- */
  normalize: function (s) { return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim(); },
  embaralhar: function (arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  },
  removerTags: function (texto) { return texto.replace(/\(\(|\)\)/g, ''); },
  rotationForIndex: function (i) {
    var seq = [-3.4, 2.8, -2, 4.2, -4.6, 1.6, 3.6, -1.4, 2.4, -3.8, 1.2, -2.6];
    return seq[i % seq.length];
  },
  shiftForIndex: function (i) {
    var seq = [4, -6, 8, -3, 6, -8, 3, -5, 7, -4, 5, -7];
    return seq[i % seq.length];
  },
  threatLevel: function (ameaca) {
    var a = ameaca.toLowerCase();
    if (a.indexOf('letal') !== -1 || a.indexOf('extrema') !== -1 || a.indexOf('naufrágio') !== -1)
      return { cls: 'vermelha', label: 'RISCO EXTREMO', color: '#d40000' };
    if (a.indexOf('sequestro') !== -1 || a.indexOf('predatória') !== -1 || a.indexOf('hipnose') !== -1 ||
        a.indexOf('biológica') !== -1 || a.indexOf('serial killer') !== -1 || a.indexOf('combustão') !== -1 || a.indexOf('acidentes') !== -1)
      return { cls: 'laranja', label: 'RISCO ELEVADO', color: '#b35900' };
    if (a.indexOf('sabotagem') !== -1 || a.indexOf('vandalismo') !== -1 || a.indexOf('desorientação') !== -1 ||
        a.indexOf('extorsão') !== -1 || a.indexOf('pânico') !== -1)
      return { cls: 'amarela', label: 'RISCO MODERADO', color: '#997300' };
    return { cls: 'azul', label: 'MONITORAMENTO', color: '#234b6e' };
  },
  esc: function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  },
  db: function () { return (typeof folcloreDB !== 'undefined') ? folcloreDB : []; },

  /* ---------- image-slot (substitui <image-slot>) ---------- */
  slotPlaceholders: {},
  slotDefaults: {},
  getSlotImage: function (id) {
    try { return localStorage.getItem('siif_slot_' + id); } catch (e) { return null; }
  },
  setSlotImage: function (id, dataUrl) {
    try { localStorage.setItem('siif_slot_' + id, dataUrl); } catch (e) { /* quota/private mode */ }
    this.refreshSlot(id);
  },
  removeSlotImage: function (id) {
    try { localStorage.removeItem('siif_slot_' + id); } catch (e) {}
    this.refreshSlot(id);
  },
  openLightbox: function (src) {
    if (!src) return;
    var ov = document.getElementById('lightbox-overlay');
    var img = document.getElementById('lightbox-img');
    if (!ov || !img) return;
    img.src = src;
    ov.classList.add('open');
  },
  closeLightbox: function () {
    var ov = document.getElementById('lightbox-overlay');
    if (ov) ov.classList.remove('open');
  },

  /* ---------- Ranking multiplayer (persistido em localStorage) ---------- */
  getPlayers: function () {
    try {
      var raw = localStorage.getItem('siif_players');
      var obj = raw ? JSON.parse(raw) : {};
      return (obj && typeof obj === 'object') ? obj : {};
    } catch (e) { return {}; }
  },
  savePlayers: function (players) {
    try { localStorage.setItem('siif_players', JSON.stringify(players)); } catch (e) {}
  },
  loadPlayerName: function () {
    try { state.playerName = localStorage.getItem('siif_current_player') || ''; } catch (e) { state.playerName = ''; }
  },
  setPlayerName: function (name) {
    name = (name || '').trim();
    if (!name) return;
    var players = App.getPlayers();
    if (!(name in players)) players[name] = 0;
    App.savePlayers(players);
    state.playerName = name;
    state.switchingPlayer = false;
    state.playerNameInput = '';
    try { localStorage.setItem('siif_current_player', name); } catch (e) {}
    App.render();
  },
  startSwitchPlayer: function () {
    state.switchingPlayer = true;
    state.playerNameInput = state.playerName || '';
    App.render();
  },
  cancelSwitchPlayer: function () {
    state.switchingPlayer = false;
    App.render();
  },
  onPlayerNameInput: function (v) { state.playerNameInput = v; },
  confirmSwitchPlayer: function () { App.setPlayerName(state.playerNameInput); },
  getPoints: function (name) {
    name = name || state.playerName;
    if (!name) return 0;
    var players = App.getPlayers();
    return players[name] || 0;
  },
  addPoints: function (n) {
    if (!n) return 0;
    state.lastPointsGain = n;
    if (!state.playerName) {
      state.pendingPoints = (state.pendingPoints || 0) + n;
      return 0;
    }
    var players = App.getPlayers();
    players[state.playerName] = (players[state.playerName] || 0) + n;
    App.savePlayers(players);
    return players[state.playerName];
  },
  claimPendingPoints: function (name) {
    name = (name || '').trim();
    if (!name || !state.pendingPoints) return;
    App.setPlayerName(name);
    var players = App.getPlayers();
    players[name] = (players[name] || 0) + state.pendingPoints;
    App.savePlayers(players);
    state.pendingPoints = 0;
    App.render();
  },
  getRank: function (points) {
    if (points === undefined) points = App.getPoints();
    var atual = RANK_TIERS[0];
    var proxima = null;
    for (var i = 0; i < RANK_TIERS.length; i++) {
      if (points >= RANK_TIERS[i].min) atual = RANK_TIERS[i];
      else { proxima = RANK_TIERS[i]; break; }
    }
    return { title: atual.title, index: RANK_TIERS.indexOf(atual), points: points, proxima: proxima };
  },

  /* ---------- Modo Cronometrado ---------- */
  _timerInterval: null,
  loadTimedMode: function () {
    try { state.timedMode = localStorage.getItem('siif_timed_mode') === '1'; } catch (e) { state.timedMode = false; }
  },
  toggleTimedMode: function () {
    state.timedMode = !state.timedMode;
    try { localStorage.setItem('siif_timed_mode', state.timedMode ? '1' : '0'); } catch (e) {}
    App.render();
  },
  stopTimer: function () {
    if (App._timerInterval) { clearInterval(App._timerInterval); App._timerInterval = null; }
  },
  startTimer: function (seconds, onExpire) {
    App.stopTimer();
    if (!state.timedMode) return;
    state.timeTotal = seconds; state.timeLeft = seconds;
    App._timerInterval = setInterval(function () {
      state.timeLeft--;
      var fill = document.getElementById('timer-fill');
      var val = document.getElementById('timer-value');
      if (fill) fill.style.width = Math.max(0, (state.timeLeft / state.timeTotal) * 100) + '%';
      if (val) val.textContent = Math.max(0, state.timeLeft) + 's';
      if (fill && state.timeLeft <= Math.ceil(state.timeTotal * 0.3)) fill.classList.add('low');
      if (state.timeLeft <= 0) {
        App.stopTimer();
        onExpire();
      }
    }, 1000);
  },
  refreshSlot: function (id) {
    var el = document.getElementById('slot-' + id);
    if (!el) return;
    var wrap = document.createElement('div');
    wrap.innerHTML = renderSlot(id, this.slotPlaceholders[id] || 'Evidência', el.className.indexOf('blur') !== -1, this.slotDefaults[id] || null);
    el.parentNode.replaceChild(wrap.firstChild, el);
  },
  triggerSlotInput: function (id) {
    var inp = document.getElementById('input-' + id);
    if (inp) inp.click();
  },
  handleSlotFile: function (evt, id) {
    var f = evt.target.files && evt.target.files[0];
    if (!f) return;
    this._readFileToSlot(f, id);
  },
  handleSlotDrop: function (evt, id) {
    evt.preventDefault();
    evt.currentTarget.classList.remove('dragover');
    var f = evt.dataTransfer.files && evt.dataTransfer.files[0];
    if (!f || f.type.indexOf('image/') !== 0) return;
    this._readFileToSlot(f, id);
  },
  _readFileToSlot: function (file, id) {
    var reader = new FileReader();
    reader.onload = function (e) { App.setSlotImage(id, e.target.result); };
    reader.readAsDataURL(file);
  },

  /* ---------- gate / boot ---------- */
  onGateInput: function (val) { state.gateInput = val; document.getElementById('gate-error').textContent = ''; },
  onGateKeydown: function (evt) { if (evt.key === 'Enter') App.verificarSenha(); },
  verificarSenha: function () {
    if (App.normalize(state.gateInput) === App.normalize(SENHA_ACESSO)) {
      state.screen = 'boot';
      App.render();
      App.startBoot();
    } else {
      state.gateError = 'Senha incorreta. Confira com o responsável pelo projeto.';
      var el = document.getElementById('gate-error');
      if (el) el.textContent = state.gateError;
    }
  },
  startBoot: function () {
    var lines = [
      '> Autenticação nível 4 confirmada.',
      '> Conectando ao Arquivo Nacional de Ocorrências...',
      '> Descriptografando dossiês classificados...',
      '> Integridade: OK.'
    ];
    state.bootLog = []; state.bootDone = false;
    this._bootTimers = [];
    var self = this;
    lines.forEach(function (line, i) {
      self._bootTimers.push(setTimeout(function () {
        state.bootLog.push(line);
        var logEl = document.getElementById('boot-log');
        if (logEl) {
          var d = document.createElement('div');
          d.textContent = line;
          logEl.appendChild(d);
        }
      }, i * 380));
    });
    this._bootTimers.push(setTimeout(function () {
      state.bootDone = true;
      App.render();
    }, lines.length * 380 + 250));
  },
  startSystem: function () { state.screen = 'map'; App.render(); },

  /* ---------- navegação ---------- */
  stopSpeech: function () {
    if ('speechSynthesis' in window && App.speakingCaseId) { window.speechSynthesis.cancel(); App.speakingCaseId = null; }
  },
  goToMap: function () { App.stopSpeech(); App.stopTimer(); state.screen = 'map'; state.mapPreviewRegion = null; state.pinPoint = null; state.linePoints = null; App.render(); },
  goToFiles: function (region) { App.stopSpeech(); App.stopTimer(); state.screen = 'files'; state.regionFilter = region || 'TODAS'; App.render(); },
  goToActivities: function () { App.stopSpeech(); App.stopTimer(); state.screen = 'activities'; App.render(); },
  setRegionFilter: function (r) { state.regionFilter = r; App.render(); },

  /* ---------- mapa ---------- */
  mapEnterRegion: function (r, el) {
    state.mapHoverRegion = r;
    document.querySelectorAll('.brasil-regiao').forEach(function (p) { p.classList.remove('hover'); });
    if (el) el.classList.add('hover');
    var label = document.getElementById('map-hover-label');
    if (label) { label.textContent = r; label.classList.add('show'); }
  },
  mapLeaveRegion: function () {
    state.mapHoverRegion = '';
    document.querySelectorAll('.brasil-regiao').forEach(function (p) { p.classList.remove('hover'); });
    var label = document.getElementById('map-hover-label');
    if (label) { label.classList.remove('show'); }
  },
  mapClickRegion: function (r, evt) {
    var areaEl = document.getElementById('map-area');
    if (areaEl && evt) {
      var rect = areaEl.getBoundingClientRect();
      state.mapPreviewRegion = r; state.linePoints = null;
      state.pinPoint = { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
      state.areaSize = { w: rect.width, h: rect.height };
    } else {
      state.mapPreviewRegion = r; state.pinPoint = null; state.linePoints = null;
    }
    App.render();
  },
  closePreview: function () { state.mapPreviewRegion = null; state.pinPoint = null; state.linePoints = null; App.render(); },
  confirmRegionSelected: function () { if (state.mapPreviewRegion) App.goToFiles(state.mapPreviewRegion); },

  /* ---------- arquivos / dossiê ---------- */
  openCase: function (id) { App.stopSpeech(); App.stopTimer(); state.screen = 'dossier'; state.openCaseId = id; state.activeTab = 'entidade'; App.render(); },
  closeCase: function () { App.stopSpeech(); App.stopTimer(); state.screen = 'files'; App.render(); },
  changeTab: function (tab) { if (tab !== 'testemunha') App.stopSpeech(); state.activeTab = tab; App.render(); },
  alertAudioLocked: function () { window.alert('Gravação bloqueada pelo perito responsável.'); },

  /* ---------- Depoimento em áudio (Web Speech API, voz pt-BR nativa do navegador) ---------- */
  speakingCaseId: null,
  ptVoice: null,
  pickPtVoice: function () {
    if (!('speechSynthesis' in window)) return null;
    var voices = window.speechSynthesis.getVoices() || [];
    var v = voices.find(function (x) { return x.lang === 'pt-BR'; }) ||
            voices.find(function (x) { return x.lang && x.lang.toLowerCase().indexOf('pt') === 0; });
    return v || null;
  },
  toggleTestemunhaAudio: function (caseId) {
    if (!('speechSynthesis' in window)) {
      window.alert('Seu navegador não suporta síntese de voz. Tente em um navegador atualizado (Chrome, Edge).');
      return;
    }
    if (App.speakingCaseId === caseId) {
      window.speechSynthesis.cancel();
      App.speakingCaseId = null;
      App.render();
      return;
    }
    window.speechSynthesis.cancel();
    var db = App.db();
    var caso = db.find(function (c) { return c.id === caseId; });
    if (!caso) return;
    var textoBruto = caso.abas.testemunha.blocos.map(function (b) { return b.texto; }).join(' ');
    var texto = textoBruto.replace(/<[^>]+>/g, '').replace(/["""]/g, '');
    var utter = new SpeechSynthesisUtterance(texto);
    utter.lang = 'pt-BR';
    var voice = App.ptVoice || App.pickPtVoice();
    if (voice) utter.voice = voice;
    utter.rate = 0.98;
    utter.pitch = 0.95;
    utter.onend = function () { App.speakingCaseId = null; App.render(); };
    utter.onerror = function () { App.speakingCaseId = null; App.render(); };
    App.speakingCaseId = caseId;
    App.render();
    window.speechSynthesis.speak(utter);
  },

  /* ---------- jogos ---------- */
  iniciarJogo: function (tipo) {
    var db = App.db();
    var ids = App.embaralhar(db.map(function (c) { return c.id; }));
    state.screen = 'game'; state.gameType = tipo; state.gameCaseIds = ids;
    state.gameIndex = 0; state.gamePoints = 0; state.gameCorrect = 0; state.gameFinished = false;
    App.render();
    setTimeout(function () { App.startRound(); }, 0);
  },
  currentGameCase: function () {
    var db = App.db();
    var id = state.gameCaseIds[state.gameIndex];
    for (var i = 0; i < db.length; i++) if (db[i].id === id) return db[i];
    return null;
  },
  startRound: function () {
    var db = App.db();
    var options = App.embaralhar(db).map(function (c) { return { id: c.id, nome: c.nome }; });
    state.gameShowedBO = false; state.gameGuessId = '';
    state.gameFeedback = ''; state.gameFeedbackOk = null; state.gameOptions = options;
    App.render();
    App.startTimer(30, function () { App.pularRodada(); });
  },
  revealBO: function () { state.gameShowedBO = true; App.render(); },
  onGuessChange: function (val) { state.gameGuessId = val; },
  confirmarPalpite: function () {
    var caso = App.currentGameCase();
    if (!state.gameGuessId || !caso) return;
    if (state.gameGuessId === caso.id) {
      App.stopTimer();
      var pontos = state.gameShowedBO ? 5 : 10;
      state.gamePoints += pontos; state.gameCorrect++;
      state.gameFeedback = '✔ Correto! Era ' + caso.nome + '. +' + pontos + ' pontos.';
      state.gameFeedbackOk = true;
      App.render();
      setTimeout(function () { App.proximaRodada(); }, 1400);
    } else {
      state.gameFeedback = '✘ Não é esse arquivo. Tente novamente ou consulte mais uma pista.';
      state.gameFeedbackOk = false;
      App.render();
    }
  },
  pularRodada: function () { App.proximaRodada(); },
  proximaRodada: function () {
    App.stopTimer();
    var next = state.gameIndex + 1;
    if (next >= state.gameCaseIds.length) {
      state.gameFinished = true;
      App.addPoints(state.gameCorrect);
      App.render();
    }
    else { state.gameIndex = next; App.render(); setTimeout(function () { App.startRound(); }, 0); }
  },
  exitGame: function () {
    if (!window.confirm('Sair agora vai fazer você perder o progresso desta investigação. Sair mesmo assim?')) return;
    App.stopTimer();
    state.screen = 'activities'; App.render();
  },

  /* ---------- Teste de Campo (Verdadeiro ou Falso) ---------- */
  iniciarJogoVF: function () {
    state.screen = 'gamevf';
    state.vfIndex = 0; state.vfTotal = 10; state.vfScore = 0; state.vfFinished = false;
    state.vfFeedback = ''; state.vfFeedbackOk = null;
    App.buildVFStatement();
    App.render();
    App.startTimer(15, function () { App.answerVF(!state.vfCurrent.isTrue); });
  },
  buildVFStatement: function () {
    var db = App.db();
    var caso = db[Math.floor(Math.random() * db.length)];
    var isTrue = Math.random() < 0.5;
    var tipo = ['regiao', 'ameaca', 'modus'][Math.floor(Math.random() * 3)];
    var text = '';
    if (tipo === 'regiao') {
      var regiaoUsada = caso.regiao;
      if (!isTrue) {
        var outras = db.map(function (c) { return c.regiao; }).filter(function (r) { return r !== caso.regiao; });
        regiaoUsada = outras[Math.floor(Math.random() * outras.length)];
      }
      text = 'O arquivo "' + caso.nome + '" está catalogado na região ' + regiaoUsada + '.';
    } else if (tipo === 'ameaca') {
      var ameacaUsada = caso.ameaca;
      if (!isTrue) {
        var outrosCasos = db.filter(function (c) { return c.id !== caso.id; });
        ameacaUsada = outrosCasos[Math.floor(Math.random() * outrosCasos.length)].ameaca;
      }
      text = 'A classificação de ameaça do arquivo "' + caso.nome + '" é: ' + ameacaUsada + '.';
    } else {
      var origemBloco = caso.abas.entidade.blocos[0].texto.replace(/<[^>]+>/g, '');
      var trecho = origemBloco.split('. ')[0] + '.';
      var nomeUsado = caso.nome;
      if (!isTrue) {
        var outrosCasos2 = db.filter(function (c) { return c.id !== caso.id; });
        nomeUsado = outrosCasos2[Math.floor(Math.random() * outrosCasos2.length)].nome;
      }
      text = 'Sobre o arquivo "' + nomeUsado + '", o dossiê registra: "' + trecho + '"';
    }
    state.vfCurrent = { text: text, isTrue: isTrue };
    state.vfFeedback = ''; state.vfFeedbackOk = null;
  },
  answerVF: function (resposta) {
    if (!state.vfCurrent) return;
    App.stopTimer();
    var acertou = resposta === state.vfCurrent.isTrue;
    if (acertou) { state.vfScore++; state.vfFeedback = '✔ Correto.'; state.vfFeedbackOk = true; }
    else { state.vfFeedback = '✘ Errado — a afirmação era ' + (state.vfCurrent.isTrue ? 'VERDADEIRA' : 'FALSA') + '.'; state.vfFeedbackOk = false; }
    App.render();
    setTimeout(function () { App.nextVF(); }, 1100);
  },
  nextVF: function () {
    var next = state.vfIndex + 1;
    if (next >= state.vfTotal) { state.vfFinished = true; App.addPoints(state.vfScore); App.render(); }
    else {
      state.vfIndex = next; App.buildVFStatement(); App.render();
      App.startTimer(15, function () { App.answerVF(!state.vfCurrent.isTrue); });
    }
  },
  exitGameVF: function () {
    if (!window.confirm('Sair agora vai encerrar o teste de campo. Sair mesmo assim?')) return;
    App.stopTimer();
    state.screen = 'activities'; App.render();
  },

  /* ---------- Mapeamento de Campo (associar lenda x região) ---------- */
  iniciarJogoAssocie: function () {
    var db = App.db();
    state.screen = 'gameassocie';
    state.amIndex = 0; state.amScore = 0; state.amFinished = false; state.amFeedback = '';
    var shuffled = App.embaralhar(db);
    state.amRounds = [];
    for (var i = 0; i < shuffled.length; i += 4) {
      state.amRounds.push(shuffled.slice(i, i + 4));
    }
    App.startAssocieRound();
    App.render();
  },
  startAssocieRound: function () {
    state.amAssign = {};
    state.amFeedback = '';
    App.startTimer(30, function () { App.checkAssocie(true); });
  },
  assignAssocie: function (caseId, regiao) {
    state.amAssign[caseId] = regiao;
    App.render();
  },
  checkAssocie: function (forcado) {
    var rodada = state.amRounds[state.amIndex] || [];
    if (!forcado && Object.keys(state.amAssign).length < rodada.length) {
      state.amFeedback = 'Associe todas as lendas da rodada antes de confirmar.';
      App.render();
      return;
    }
    App.stopTimer();
    var acertos = 0;
    rodada.forEach(function (c) { if (state.amAssign[c.id] === c.regiao) acertos++; });
    state.amScore += acertos;
    state.amFeedback = (forcado ? '⏱ Tempo esgotado! ' : '') + (acertos === rodada.length
      ? '✔ Rodada perfeita! ' + acertos + '/' + rodada.length + ' corretas.'
      : acertos + ' de ' + rodada.length + ' associações corretas.');
    App.render();
    setTimeout(function () { App.nextAssocie(); }, 1600);
  },
  nextAssocie: function () {
    var next = state.amIndex + 1;
    if (next >= state.amRounds.length) { state.amFinished = true; App.addPoints(state.amScore); App.render(); }
    else { state.amIndex = next; App.startAssocieRound(); App.render(); }
  },
  exitGameAssocie: function () {
    if (!window.confirm('Sair agora vai encerrar o mapeamento de campo. Sair mesmo assim?')) return;
    App.stopTimer();
    state.screen = 'activities'; App.render();
  },

  /* ---------- Detetive de Eliminação ---------- */
  iniciarJogoDetetive: function () {
    state.screen = 'gamedet';
    state.detIndex = 0; state.detTotal = 6; state.detScore = 0; state.detAcertos = 0; state.detFinished = false;
    App.startDetetiveRound();
    App.render();
  },
  startDetetiveRound: function () {
    var db = App.db();
    var embaralhado = App.embaralhar(db);
    var alvo = embaralhado[0];
    var suspeitos = App.embaralhar(embaralhado.slice(1, 6).concat([alvo]));
    var trechoMO = App.removerTags(alvo.abas.entidade.blocos[0].texto).split('. ')[0] + '.';
    state.detSuspects = suspeitos;
    state.detTargetId = alvo.id;
    state.detPistas = [
      'O arquivo do culpado está catalogado na região ' + alvo.regiao + '.',
      'A classificação de ameaça registrada é: "' + alvo.ameaca + '".',
      'Trecho do modus operandi: "' + trechoMO + '"',
    ];
    state.detPistaIndex = 1;
    state.detEliminados = {};
    state.detFeedback = ''; state.detFeedbackOk = null; state.detRoundOver = false;
    App.render();
    App.startTimer(25, function () { App.avancarPistaDet(true); });
  },
  toggleEliminarSuspeito: function (id) {
    if (state.detRoundOver) return;
    if (state.detEliminados[id]) delete state.detEliminados[id];
    else state.detEliminados[id] = true;
    App.render();
  },
  avancarPistaDet: function (peloTempo) {
    App.stopTimer();
    if (state.detRoundOver) return;
    if (state.detPistaIndex < state.detPistas.length) {
      state.detPistaIndex++;
      App.render();
      App.startTimer(25, function () { App.avancarPistaDet(true); });
    } else if (peloTempo) {
      App.confirmarSuspeitoFinal(null);
    }
  },
  confirmarSuspeitoFinal: function (id) {
    if (state.detRoundOver) return;
    App.stopTimer();
    state.detRoundOver = true;
    var acertou = id === state.detTargetId;
    var pontos = 0;
    if (acertou) {
      pontos = Math.max(30 - (state.detPistaIndex - 1) * 10, 10);
      state.detScore += pontos;
      state.detAcertos++;
    }
    var alvo = null;
    for (var i = 0; i < state.detSuspects.length; i++) if (state.detSuspects[i].id === state.detTargetId) alvo = state.detSuspects[i];
    state.detFeedback = acertou
      ? '✔ Caso encerrado! Era mesmo ' + (alvo ? alvo.nome : '') + '. +' + pontos + ' pontos.'
      : '✘ Suspeito errado. O verdadeiro culpado era ' + (alvo ? alvo.nome : '') + '.';
    state.detFeedbackOk = acertou;
    App.render();
    setTimeout(function () { App.nextDetetive(); }, 2200);
  },
  nextDetetive: function () {
    var next = state.detIndex + 1;
    if (next >= state.detTotal) { state.detFinished = true; App.addPoints(state.detAcertos); App.render(); }
    else { state.detIndex = next; App.startDetetiveRound(); }
  },
  exitGameDetetive: function () {
    if (!window.confirm('Sair agora vai encerrar a investigação. Sair mesmo assim?')) return;
    App.stopTimer();
    state.screen = 'activities'; App.render();
  },

  /* ---------- Reconhecimento Visual ---------- */
  iniciarJogoRV: function () {
    state.screen = 'gamerv';
    state.rvIndex = 0; state.rvTotal = 10; state.rvScore = 0; state.rvFinished = false;
    App.buildRVRound();
    App.render();
  },
  buildRVRound: function () {
    var db = App.db();
    var embaralhado = App.embaralhar(db);
    var alvo = embaralhado[0];
    var opcoes = App.embaralhar([alvo].concat(embaralhado.slice(1, 4)));
    state.rvCurrent = { alvoId: alvo.id, foto: alvo.abas.entidade.foto, opcoes: opcoes };
    state.rvFeedback = ''; state.rvFeedbackOk = null;
    App.render();
    App.startTimer(15, function () { App.answerRV(''); });
  },
  answerRV: function (guessId) {
    if (!state.rvCurrent || state.rvFeedback) return;
    App.stopTimer();
    var acertou = guessId === state.rvCurrent.alvoId;
    var nomeAlvo = state.rvCurrent.opcoes.filter(function (o) { return o.id === state.rvCurrent.alvoId; })[0];
    state.rvCurrent.guessId = guessId;
    if (acertou) { state.rvScore++; state.rvFeedback = '✔ Correto! Era ' + (nomeAlvo ? nomeAlvo.nome : '') + '.'; state.rvFeedbackOk = true; }
    else { state.rvFeedback = '✘ Errado — era ' + (nomeAlvo ? nomeAlvo.nome : '') + '.'; state.rvFeedbackOk = false; }
    App.render();
    setTimeout(function () { App.nextRV(); }, 1400);
  },
  nextRV: function () {
    var next = state.rvIndex + 1;
    if (next >= state.rvTotal) { state.rvFinished = true; App.addPoints(state.rvScore); App.render(); }
    else { state.rvIndex = next; App.buildRVRound(); }
  },
  exitGameRV: function () {
    if (!window.confirm('Sair agora vai encerrar o reconhecimento visual. Sair mesmo assim?')) return;
    App.stopTimer();
    state.screen = 'activities'; App.render();
  },

  /* ---------- ciclo de vida ---------- */
  _clockTimer: null,
  init: function () {
    App._clockTimer = setInterval(function () {
      state.clock = new Date().toLocaleString('pt-BR');
      var el = document.getElementById('clock-el');
      if (el) el.textContent = state.clock;
    }, 1000);
    state.clock = new Date().toLocaleString('pt-BR');
    App.loadTimedMode();
    App.loadPlayerName();
    if ('speechSynthesis' in window) {
      App.ptVoice = App.pickPtVoice();
      window.speechSynthesis.onvoiceschanged = function () { App.ptVoice = App.pickPtVoice(); };
    }
    App.render();
  },
  afterRender: function () {
    if (state.mapPreviewRegion && state.pinPoint && !state.linePoints) {
      requestAnimationFrame(function () {
        var areaEl = document.getElementById('map-area');
        var anchorEl = document.getElementById('card-anchor');
        if (areaEl && anchorEl) {
          var areaRect = areaEl.getBoundingClientRect();
          var anchorRect = anchorEl.getBoundingClientRect();
          state.linePoints = {
            x1: state.pinPoint.x, y1: state.pinPoint.y,
            x2: anchorRect.left + anchorRect.width / 2 - areaRect.left,
            y2: anchorRect.top + anchorRect.height / 2 - areaRect.top,
          };
          state.areaSize = { w: areaRect.width, h: areaRect.height };
          App.render();
        }
      });
    }
  },

  render: function () {
    var root = document.getElementById('app');
    if (!root) return;
    var html = '';
    if (state.screen === 'gate') html = renderGate();
    else if (state.screen === 'boot') html = renderBoot();
    else html = renderChrome();
    root.innerHTML = html;
    if (state.screen === 'gate') {
      var gi = document.getElementById('gate-input');
      if (gi) gi.focus();
    }
    App.afterRender();
  },
};

/* ========================= templates ========================= */

function renderSlot(id, placeholder, blurClass, defaultSrc) {
  App.slotPlaceholders[id] = placeholder;
  if (defaultSrc) App.slotDefaults[id] = defaultSrc;
  else defaultSrc = App.slotDefaults[id] || null;
  var data = App.getSlotImage(id);
  var inner;
  if (data) {
    // imagem enviada pelo usuário (localStorage) — tem prioridade
    inner = '<img src="' + data + '" alt="evidência anexada">' +
      '<div class="slot-zoom" onclick="event.stopPropagation();App.openLightbox(\'' + data + '\')" title="Ampliar imagem">🔍</div>' +
      '<div class="slot-remove" onclick="event.stopPropagation();App.removeSlotImage(\'' + id + '\')" title="Remover e voltar à foto do arquivo">×</div>';
  } else if (defaultSrc) {
    // foto original do dossiê (arquivo estático do projeto)
    inner = '<img src="' + defaultSrc + '" alt="' + App.esc(placeholder) + '" onerror="this.parentNode.classList.add(\'slot-broken\')">' +
      '<div class="slot-zoom" onclick="event.stopPropagation();App.openLightbox(\'' + defaultSrc + '\')" title="Ampliar imagem">🔍</div>';
  } else {
    inner = '<div class="slot-placeholder">📎 ' + App.esc(placeholder) + '<br><small>Clique ou arraste uma imagem</small></div>';
  }
  return '<div class="slot' + (blurClass ? ' blur' : '') + '" id="slot-' + id + '" style="width:100%;height:100%" ' +
    'ondragover="event.preventDefault();this.classList.add(\'dragover\')" ' +
    'ondragleave="this.classList.remove(\'dragover\')" ' +
    'ondrop="App.handleSlotDrop(event,\'' + id + '\')" ' +
    'onclick="App.triggerSlotInput(\'' + id + '\')" title="Clique para enviar sua própria imagem para este espaço">' +
    inner +
    '<input type="file" accept="image/*" id="input-' + id + '" onchange="App.handleSlotFile(event,\'' + id + '\')">' +
    '</div>';
}

function renderEvidenciaGaleria(caseId) {
  var lista = (typeof EVIDENCIAS_TURMA !== 'undefined') ? (EVIDENCIAS_TURMA[caseId] || []) : [];
  if (!lista.length) return '';
  var itens = lista.map(function (src) {
    return '<div class="evidencia-thumb" onclick="App.openLightbox(\'' + src + '\')" title="Ampliar imagem"><img src="' + src + '" alt="Evidência enviada pela turma"></div>';
  }).join('');
  return '<div class="evidencia-galeria-label">Já enviado pela turma:</div><div class="evidencia-galeria">' + itens + '</div>';
}

function renderGate() {
  return '' +
    '<div class="full-lock-screen">' +
    '  <img src="' + BADGE_DATAURL + '" alt="Distintivo D.I.P." style="width:280px;height:280px;object-fit:contain;filter:drop-shadow(0 6px 18px rgba(0,0,0,.9));margin-bottom:6px;">' +
    '  <h1>S.I.I.F</h1>' +

function renderMap() {
  var db = App.db();
  var mapRegionsHtml = REGION_LIST.map(function (r) {
    var d = REGION_PATHS[r] || '';
    return '<path class="brasil-regiao" data-regiao="' + r + '" d="' + d + '" ' +
      'onmouseenter="App.mapEnterRegion(\'' + r + '\', this)" onmouseleave="App.mapLeaveRegion()" ' +
      'onclick="App.mapClickRegion(\'' + r + '\', event)"></path>';
  }).join('');

  var pinHtml = '';
  if (state.pinPoint) {
    var pinStyle = 'left:' + (state.pinPoint.x - 14) + 'px;top:' + (state.pinPoint.y - 28) + 'px;';
    pinHtml = '<div class="map-pin" style="' + pinStyle + '"></div>';
  }
  var lineHtml = '';
  if (state.linePoints && state.areaSize) {
    lineHtml = '<svg class="map-line-overlay" style="width:' + state.areaSize.w + 'px;height:' + state.areaSize.h + 'px;">' +
      '<line x1="' + state.linePoints.x1 + '" y1="' + state.linePoints.y1 + '" x2="' + state.linePoints.x2 + '" y2="' + state.linePoints.y2 + '" ' +
      'pathLength="1" style="stroke:#d40000;stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 3px rgba(212,0,0,.8));animation:lineDraw .5s ease forwards;"></line></svg>';
  }

  var cardHtml = '';
  if (state.mapPreviewRegion && state.pinPoint && state.areaSize) {
    var dir = REGION_POPUP_DIR[state.mapPreviewRegion] || 'bottom';
    var CW = 300, GAP = 26;
    var clamp = function (v, min, max) { return Math.max(min, Math.min(max, v)); };
    var cardPos = '', anchorPos = '';
    if (dir === 'top') {
      cardPos = 'bottom:' + clamp(state.areaSize.h - state.pinPoint.y + GAP, 8, state.areaSize.h - 210) + 'px;left:' + clamp(state.pinPoint.x - CW / 2, 8, state.areaSize.w - CW - 8) + 'px;';
      anchorPos = 'bottom:-16px;left:calc(50% - 14px);';
    } else if (dir === 'bottom') {
      cardPos = 'top:' + clamp(state.pinPoint.y + GAP, 8, state.areaSize.h - 210) + 'px;left:' + clamp(state.pinPoint.x - CW / 2, 8, state.areaSize.w - CW - 8) + 'px;';
      anchorPos = 'top:-16px;left:calc(50% - 14px);';
    } else if (dir === 'right') {
      cardPos = 'left:' + (state.pinPoint.x + GAP) + 'px;top:' + clamp(state.pinPoint.y - 90, 8, state.areaSize.h - 180) + 'px;';
      anchorPos = 'left:-16px;top:calc(50% - 14px);';
    } else {
      cardPos = 'right:' + (state.areaSize.w - state.pinPoint.x + GAP) + 'px;top:' + clamp(state.pinPoint.y - 90, 8, state.areaSize.h - 180) + 'px;';
      anchorPos = 'right:-16px;top:calc(50% - 14px);';
    }
    var previewCases = db.filter(function (c) { return c.regiao === state.mapPreviewRegion; }).slice(0, 3);
    var previewCount = db.filter(function (c) { return c.regiao === state.mapPreviewRegion; }).length;
    var miniHtml = previewCases.map(function (pc) { return '<div class="mini-card">' + App.esc(pc.nome) + '</div>'; }).join('');
    cardHtml = '' +
      '<div class="preview-card" style="' + cardPos + '">' +
      '  <div class="preview-card-inner">' +
      '    <div class="preview-anchor" id="card-anchor" style="' + anchorPos + '"></div>' +
      '    <div class="preview-close" onclick="App.closePreview()">×</div>' +
      '    <h3>REGIÃO: ' + App.esc(state.mapPreviewRegion.toUpperCase()) + ' — ' + previewCount + ' ARQUIVO(S)</h3>' +
      '    <div class="mini-cards">' + miniHtml + '</div>' +
      '    <button class="btn" onclick="App.confirmRegionSelected()">SELECIONAR REGIÃO</button>' +
      '  </div>' +
      '</div>';
  }

  return '' +
    '<p class="landing-intro">&gt; BANCO DE DADOS CARREGADO. ' + db.length + ' ARQUIVOS DISPONÍVEIS.<br>Selecione uma região no mapa para ver uma prévia, ou acesse o arquivo completo.</p>' +
    '<div id="map-area">' +
    '  <div class="map-wrapper">' +
    '    <svg id="brasil-map" viewBox="0 0 760 760" width="760" height="760" preserveAspectRatio="xMidYMid meet">' + mapRegionsHtml + '</svg>' +
    '    <div id="map-hover-label"' + (state.mapHoverRegion ? ' class="show"' : '') + '>' + App.esc(state.mapHoverRegion) + '</div>' +
    '  </div>' +
    pinHtml + lineHtml + cardHtml +
    '</div>' +
    '<div class="map-actions">' +
    '  <button class="btn" onclick="App.goToFiles(\'TODAS\')">VER TODOS OS ARQUIVOS</button>' +
    '  <button class="btn" onclick="App.goToActivities()">ATIVIDADES INVESTIGATIVAS</button>' +
    '</div>';
}

function renderFiles() {
  var db = App.db();
  var regions = [];
  db.forEach(function (c) { if (regions.indexOf(c.regiao) === -1) regions.push(c.regiao); });
  var filterOptions = ['TODAS'].concat(regions);
  var filtersHtml = filterOptions.map(function (r) {
    var active = state.regionFilter === r;
    return '<button class="filter-btn' + (active ? ' active' : '') + '" onclick="App.setRegionFilter(\'' + r + '\')">' +
      (r === 'TODAS' ? 'Todas as Regiões' : App.esc(r)) + '</button>';
  }).join('');

  var visibleCases = db.filter(function (c) { return state.regionFilter === 'TODAS' || c.regiao === state.regionFilter; });
  var cardsHtml = visibleCases.map(function (c, i) {
    var nivel = App.threatLevel(c.ameaca);
    var rot = App.rotationForIndex(i);
    var shift = App.shiftForIndex(i);
    return '' +
      '<div class="case-card ' + nivel.cls + '" style="--rot:' + rot + 'deg;--shift:' + shift + 'px" onclick="App.openCase(\'' + c.id + '\')">' +
      '  <div class="case-id">PROC Nº ' + App.esc(c.id) + '/2026</div>' +
      '  <div class="case-title">' + App.esc(c.nome) + '</div>' +
      '  <div class="case-region">' + App.esc(c.regiao) + '</div>' +
      '  <div class="case-threat">Tipo: ' + App.esc(c.ameaca) + '</div>' +
      '  <span class="threat-tag ' + nivel.cls + '">' + nivel.label + '</span>' +
      '</div>';
  }).join('');

  return '' +
    '<p style="color:#7fbf6a;font-size:.95em;margin-bottom:4px;">&gt; BANCO DE DADOS CARREGADO. ' + db.length + ' ARQUIVOS DISPONÍVEIS.</p>' +
    '<p style="color:#999;">Selecione uma região ou um arquivo físico para expandir o dossiê completo:</p>' +
    '<div class="filters">' + filtersHtml + '</div>' +
    '<div class="grid">' + cardsHtml + '</div>';
}

function renderDossier() {
  var db = App.db();
  var caso = null;
  for (var i = 0; i < db.length; i++) if (db[i].id === state.openCaseId) { caso = db[i]; break; }
  if (!caso) return '<p>Arquivo não encontrado.</p>';

  var nivel = App.threatLevel(caso.ameaca);
  var tabsDef = [
    { key: 'entidade', n: '1', label: 'O Suspeito' },
    { key: 'testemunha', n: '2', label: 'A Testemunha' },
    { key: 'desaparecido', n: '3', label: 'A Vítima / B.O.' },
    { key: 'evidencias', n: '4', label: 'Evidências da Turma' },
  ];
  var tabsHtml = tabsDef.map(function (t) {
    return '<button class="tab-btn' + (state.activeTab === t.key ? ' active' : '') + '" onclick="App.changeTab(\'' + t.key + '\')">' + t.n + '. ' + t.label + '</button>';
  }).join('');

  var isEvidencias = state.activeTab === 'evidencias';
  var body = '';
  if (isEvidencias) {
    var turmaSlotId = 'photo-' + caso.id + '-turma';
    body = '' +
      '<div style="flex:1;min-width:280px;">' +
      '  <p style="color:#3a3226;font-size:.95em;line-height:1.6;">Envie a foto de capa do cartaz, maquete, desenho ou apresentação da turma sobre esta lenda. Arraste a imagem para a área abaixo.</p>' +
      '  <div style="width:100%;max-width:420px;height:260px;margin:12px auto;">' + renderSlot(turmaSlotId, 'Foto de capa do trabalho da turma') + '</div>' +
      '  ' + renderEvidenciaGaleria(caso.id) +
      '</div>';
  } else {
    var dados = caso.abas[state.activeTab];
    var stampLabels = { entidade: 'EVIDÊNCIA', testemunha: 'DEPOIMENTO', desaparecido: 'ANEXO' };
    var photoSlotId = 'photo-' + caso.id + '-' + state.activeTab;
    var blocksHtml = dados.blocos.map(function (b) {
      return '<span class="section-label">' + App.esc(b.label) + ':</span>' +
        '<p class="dossier-p">' + b.texto + '</p>';
    }).join('');
    var audioHtml = '';
    if (state.activeTab === 'testemunha' && dados.audio) {
      var dur = dados.duracao || '03:14';
      var isSpeaking = App.speakingCaseId === caso.id;
      audioHtml = '' +
        '<div class="audio-player" id="audio-player-' + caso.id + '">' +
        '  <div class="audio-play' + (isSpeaking ? ' playing' : '') + '" onclick="App.toggleTestemunhaAudio(\'' + caso.id + '\')" title="' + (isSpeaking ? 'Parar' : 'Ouvir depoimento (voz sintetizada)') + '"></div>' +
        '  <div class="audio-wave' + (isSpeaking ? ' active' : '') + '"></div>' +
        '  <div class="audio-label">DEPOIMENTO RECONSTITUÍDO — [' + dur + '] <span class="audio-hint">voz sintetizada, não é gravação original</span></div>' +
        '</div>';
    }
    body = '' +
      '<div class="evidence-board">' +
      '  <div class="photo-frame">' +
      '    ' + renderSlot(photoSlotId, 'Foto forense / evidência', false, dados.foto || null) +
      '    <div class="photo-caption">' + App.esc(dados.legenda) + '</div>' +
      '  </div>' +
      '  <div class="stamp">' + (stampLabels[state.activeTab] || '') + '</div>' +
      '</div>' +
      '<div class="text-content">' + audioHtml + blocksHtml + '</div>';
  }

  var notaHtml = caso.nota_detetive ? '<div class="detetive-note">' + App.esc(caso.nota_detetive) + '</div>' : '';

  return '' +
    '<div class="toolbar"><button class="btn" onclick="App.closeCase()">« DEVOLVER ARQUIVO À ESTANTE</button></div>' +
    '<div class="dossier-wrapper">' +
    '  <div class="coffee-ring"></div>' +
    '  <div class="ink-smudge"></div>' +
    notaHtml +
    '  <h2 class="dossier-title">ARQUIVO: ' + App.esc(caso.nome) + '</h2>' +
    '  <div class="case-number">Dossiê Físico Nº ' + App.esc(caso.id) + ' — Divisão de Ocorrências</div>' +
    '  <div class="dossier-meta">' +
    '    <span><b>Região:</b> ' + App.esc(caso.regiao) + '</span>' +
    '    <span><b>Ameaça:</b> ' + App.esc(caso.ameaca) + '</span>' +
    '    <span class="classification-badge ' + nivel.cls + '">' + nivel.label + '</span>' +
    '  </div>' +
    '  <div class="tabs">' + tabsHtml + '</div>' +
    '  <div class="tab-body">' + body + '</div>' +
    '</div>';
}

function renderRankPanel() {
  var players = App.getPlayers();
  var names = Object.keys(players);
  var rank = App.getRank();
  var atual = RANK_TIERS[rank.index];
  var proxima = rank.proxima;
  var pct = proxima ? Math.min(100, Math.round(((rank.points - atual.min) / (proxima.min - atual.min)) * 100)) : 100;

  var currentBlock = '';
  if (state.playerName) {
    currentBlock = '' +
      '<div class="rank-current">' +
      '  <div class="rank-current-badge">🏅</div>' +
      '  <div>' +
      '    <div class="rank-current-title">' + App.esc(state.playerName) + ' — ' + App.esc(atual.title) + '</div>' +
      '    <div class="rank-current-xp">' + rank.points + ' pontos' + (proxima ? ' — faltam ' + (proxima.min - rank.points) + ' para ' + App.esc(proxima.title) : ' — patente máxima atingida!') + '</div>' +
      '    <div class="rank-progress-bar"><div class="rank-progress-fill" style="width:' + pct + '%"></div></div>' +
      '  </div>' +
      '</div>';
  } else {
    currentBlock = '<p style="color:var(--text-muted);font-size:.85em;margin:0 0 12px;">Informe seu nome para entrar no ranking da turma e guardar seus pontos.</p>';
  }

  var leaderboardHtml = '';
  if (names.length) {
    var sorted = names.slice().sort(function (a, b) { return players[b] - players[a]; });
    var rowsHtml = sorted.map(function (n, i) {
      var r = App.getRank(players[n]);
      return '<div class="leaderboard-row' + (n === state.playerName ? ' me' : '') + '">' +
        '<span class="leaderboard-pos">' + (i + 1) + 'º</span>' +
        '<span class="leaderboard-name">' + App.esc(n) + '</span>' +
        '<span class="leaderboard-rank">' + App.esc(r.title) + '</span>' +
        '<span class="leaderboard-pts">' + players[n] + ' pts</span>' +
        '</div>';
    }).join('');
    leaderboardHtml = '<div class="leaderboard"><div class="leaderboard-label">Ranking da Turma (' + names.length + ' investigador' + (names.length > 1 ? 'es' : '') + ')</div>' + rowsHtml + '</div>';
  }

  var tiersHtml = RANK_TIERS.map(function (t, i) {
    return '<div class="rank-tier' + (state.playerName && i === rank.index ? ' current' : (state.playerName && i < rank.index ? ' done' : '')) + '">' +
      '<span class="rank-tier-n">' + (i + 1) + '</span><span class="rank-tier-title">' + App.esc(t.title) + '</span>' +
      '<span class="rank-tier-min">' + t.min + ' pts</span></div>';
  }).join('');

  return '' +
    '<div class="rank-panel">' +
    currentBlock +
    renderPlayerSwitcher() +
    leaderboardHtml +
    '  <div class="rank-ladder">' + tiersHtml + '</div>' +
    '</div>';
}

function renderPointsGainedLine() {
  if (state.playerName && state.lastPointsGain) {
    return '<p class="score">+' + state.lastPointsGain + ' ponto' + (state.lastPointsGain === 1 ? '' : 's') + ' para ' + App.esc(state.playerName) + '!</p>';
  }
  if (!state.playerName && state.pendingPoints) {
    return '' +
      '<div class="points-claim">' +
      '  <p>Você fez <strong>' + state.pendingPoints + ' ponto' + (state.pendingPoints === 1 ? '' : 's') + '</strong> nesta atividade! Informe seu nome para entrar no ranking da turma e guardar sua pontuação:</p>' +
      '  <input type="text" class="player-name-input" placeholder="Seu nome" maxlength="24" value="' + App.esc(state.playerNameInput) + '" ' +
      '    oninput="App.onPlayerNameInput(this.value)" onkeydown="if(event.key===\'Enter\')App.claimPendingPoints(state.playerNameInput)">' +
      '  <button class="btn btn-sm" onclick="App.claimPendingPoints(state.playerNameInput)">SALVAR PONTUAÇÃO</button>' +
      '</div>';
  }
  return '';
}

function renderTimerBar() {
  if (!state.timedMode) return '';
  return '<div class="timer-bar"><div class="timer-fill" id="timer-fill" style="width:100%"></div><div class="timer-value" id="timer-value">' + state.timeTotal + 's</div></div>';
}

function renderGame() {
  var caso = App.currentGameCase();
  var title = 'DESCUBRA A LENDA';
  var progressText = 'Caso ' + (state.gameIndex + 1) + ' de ' + state.gameCaseIds.length + ' — Pontuação: ' + state.gamePoints;

  var exitBtn = '<div class="toolbar"><button class="btn" onclick="App.exitGame()">« ABANDONAR INVESTIGAÇÃO</button></div>';

  if (state.gameFinished) {
    return exitBtn +
      '<div class="game-summary">' +
      '  <h2>INVESTIGAÇÃO ENCERRADA</h2>' +
      '  <p>Você acertou ' + state.gameCorrect + ' de ' + state.gameCaseIds.length + ' casos.</p>' +
      '  <p class="score">Pontuação final: ' + state.gamePoints + '</p>' +
      renderPointsGainedLine() +
      '  <button class="btn" style="margin-top:14px;" onclick="App.goToActivities()">VOLTAR ÀS ATIVIDADES</button>' +
      '</div>';
  }

  if (!caso) return exitBtn + '<p>Carregando rodada...</p>';

  var dep = App.removerTags(caso.abas.testemunha.blocos.map(function (b) { return b.texto; }).join(' '));
  var bo = App.removerTags(caso.abas.desaparecido.blocos.map(function (b) { return b.texto; }).join(' '));
  var clueLabel = state.gameShowedBO ? 'Depoimento da testemunha + Boletim de Ocorrência' : 'Depoimento da testemunha';
  var clueText = state.gameShowedBO ? (dep + '\n\n— B.O. —\n' + bo) : dep;
  var showBOButton = !state.gameShowedBO;
  var showNextClueButton = false;
  var clueBlock = '<div class="game-clue-label">' + App.esc(clueLabel) + '</div><div class="game-clue-text">' + App.esc(clueText) + '</div>';
  var cluesBlock = '';

  var optionsHtml = '<option value="">— selecione a lenda —</option>' + state.gameOptions.map(function (o) {
    return '<option value="' + o.id + '"' + (state.gameGuessId === o.id ? ' selected' : '') + '>' + App.esc(o.nome) + '</option>';
  }).join('');

  var feedbackClass = state.gameFeedbackOk === true ? ' ok' : state.gameFeedbackOk === false ? ' fail' : '';

  return exitBtn +
    '<div class="game-progress">' + progressText + '</div>' +
    renderTimerBar() +
    '<div class="game-board">' +
    '  <div class="game-header"><h2>' + title + '</h2></div>' +
    '  <div class="game-warning">⚠ Não saia desta tela para consultar o arquivo físico: o progresso desta investigação será perdido.</div>' +
    clueBlock + cluesBlock +
    '  <div class="game-actions">' +
    (showBOButton ? '<button class="btn" onclick="App.revealBO()">CONSULTAR BOLETIM DE OCORRÊNCIA</button>' : '') +
    (showNextClueButton ? '<button class="btn" onclick="App.revealNextClue()">PEDIR PRÓXIMA PISTA</button>' : '') +
    '    <button class="btn" onclick="App.pularRodada()">[ ARQUIVAR — EVIDÊNCIA INCONCLUSIVA ]</button>' +
    '  </div>' +
    '  <div class="game-guess-row">' +
    '    <select onchange="App.onGuessChange(this.value)">' + optionsHtml + '</select>' +
    '    <button class="btn" onclick="App.confirmarPalpite()">CONFIRMAR PALPITE</button>' +
    '  </div>' +
    '  <div class="game-feedback' + feedbackClass + '">' + App.esc(state.gameFeedback) + '</div>' +
    '</div>';
}

function renderGameVF() {
  var exitBtn = '<div class="toolbar"><button class="btn" onclick="App.exitGameVF()">« ABANDONAR TESTE</button></div>';
  if (state.vfFinished) {
    return exitBtn +
      '<div class="game-summary">' +
      '  <h2>TESTE DE CAMPO ENCERRADO</h2>' +
      '  <p>Você acertou ' + state.vfScore + ' de ' + state.vfTotal + ' afirmações.</p>' +
      '  <p class="score">Aproveitamento: ' + Math.round((state.vfScore / state.vfTotal) * 100) + '%</p>' +
      renderPointsGainedLine() +
      '  <button class="btn" style="margin-top:14px;" onclick="App.goToActivities()">VOLTAR ÀS ATIVIDADES</button>' +
      '</div>';
  }
  var c = state.vfCurrent || { text: '', isTrue: true };
  var feedbackClass = state.vfFeedbackOk === true ? ' ok' : state.vfFeedbackOk === false ? ' fail' : '';
  var answered = state.vfFeedback !== '';
  return exitBtn +
    '<div class="game-progress">Rodada ' + (state.vfIndex + 1) + ' de ' + state.vfTotal + ' — Acertos: ' + state.vfScore + '</div>' +
    renderTimerBar() +
    '<div class="game-board">' +
    '  <div class="game-header"><h2>TESTE DE CAMPO</h2></div>' +
    '  <div class="game-clue-label">AFIRMAÇÃO SOB ANÁLISE</div>' +
    '  <div class="game-clue-text">' + App.esc(c.text) + '</div>' +
    '  <div class="game-actions">' +
    '    <button class="btn" ' + (answered ? 'disabled' : '') + ' onclick="App.answerVF(true)">VERDADEIRO</button>' +
    '    <button class="btn" ' + (answered ? 'disabled' : '') + ' onclick="App.answerVF(false)">FALSO</button>' +
    '  </div>' +
    '  <div class="game-feedback' + feedbackClass + '">' + App.esc(state.vfFeedback) + '</div>' +
    '</div>';
}

function renderGameAssocie() {
  var exitBtn = '<div class="toolbar"><button class="btn" onclick="App.exitGameAssocie()">« ABANDONAR MAPEAMENTO</button></div>';
  if (state.amFinished) {
    var totalPossivel = state.amRounds.reduce(function (acc, r) { return acc + r.length; }, 0);
    return exitBtn +
      '<div class="game-summary">' +
      '  <h2>MAPEAMENTO DE CAMPO ENCERRADO</h2>' +
      '  <p>Você associou corretamente ' + state.amScore + ' de ' + totalPossivel + ' lendas às suas regiões.</p>' +
      renderPointsGainedLine() +
      '  <button class="btn" style="margin-top:14px;" onclick="App.goToActivities()">VOLTAR ÀS ATIVIDADES</button>' +
      '</div>';
  }
  var rodada = state.amRounds[state.amIndex] || [];
  var linhas = rodada.map(function (c) {
    var opcoes = REGION_LIST.map(function (r) {
      return '<option value="' + r + '"' + (state.amAssign[c.id] === r ? ' selected' : '') + '>' + r + '</option>';
    }).join('');
    return '<div class="game-guess-row" style="justify-content:space-between;max-width:520px;margin:0 auto 12px;">' +
      '<span style="min-width:200px;text-align:left;">' + App.esc(c.nome) + '</span>' +
      '<select onchange="App.assignAssocie(\'' + c.id + '\', this.value)"><option value="">— região —</option>' + opcoes + '</select>' +
      '</div>';
  }).join('');
  return exitBtn +
    '<div class="game-progress">Rodada ' + (state.amIndex + 1) + ' de ' + state.amRounds.length + ' — Pontos: ' + state.amScore + '</div>' +
    renderTimerBar() +
    '<div class="game-board">' +
    '  <div class="game-header"><h2>MAPEAMENTO DE CAMPO</h2></div>' +
    '  <div class="game-warning" style="background:rgba(0,0,0,.3);border-color:#444;color:#ccc;">Associe cada lenda abaixo à região do Brasil onde o caso está catalogado.</div>' +
    linhas +
    '  <div class="game-actions"><button class="btn" onclick="App.checkAssocie()">CONFIRMAR ASSOCIAÇÕES</button></div>' +
    '  <div class="game-feedback">' + App.esc(state.amFeedback) + '</div>' +
    '</div>';
}

function renderGameDetetive() {
  var exitBtn = '<div class="toolbar"><button class="btn" onclick="App.exitGameDetetive()">« ABANDONAR INVESTIGAÇÃO</button></div>';
  if (state.detFinished) {
    return exitBtn +
      '<div class="game-summary">' +
      '  <h2>INVESTIGAÇÃO ENCERRADA</h2>' +
      '  <p>Você reuniu ' + state.detScore + ' pontos ao longo de ' + state.detTotal + ' casos de eliminação.</p>' +
      '  <p class="score">Pontuação final: ' + state.detScore + '</p>' +
      renderPointsGainedLine() +
      '  <button class="btn" style="margin-top:14px;" onclick="App.goToActivities()">VOLTAR ÀS ATIVIDADES</button>' +
      '</div>';
  }
  var pistasHtml = state.detPistas.slice(0, state.detPistaIndex).map(function (p, i) {
    return '<div class="clue-block"><div class="game-clue-label">PISTA ' + (i + 1) + '</div><div class="game-clue-text">' + App.esc(p) + '</div></div>';
  }).join('');
  var showNextClueButton = state.detPistaIndex < state.detPistas.length && !state.detRoundOver;
  var suspeitosHtml = state.detSuspects.map(function (s) {
    var eliminado = !!state.detEliminados[s.id];
    var cls = 'suspect-card' + (eliminado ? ' eliminated' : '') + (state.detRoundOver && s.id === state.detTargetId ? ' revealed-target' : '');
    return '' +
      '<div class="' + cls + '">' +
      '  <div class="suspect-name">' + App.esc(s.nome) + '</div>' +
      '  <div class="suspect-region">' + App.esc(s.regiao) + '</div>' +
      '  <div class="suspect-actions">' +
      '    <button class="btn btn-sm" ' + (state.detRoundOver ? 'disabled' : '') + ' onclick="App.toggleEliminarSuspeito(\'' + s.id + '\')">' + (eliminado ? 'REINCLUIR' : 'ELIMINAR') + '</button>' +
      '    <button class="btn btn-sm btn-accuse" ' + (state.detRoundOver || eliminado ? 'disabled' : '') + ' onclick="App.confirmarSuspeitoFinal(\'' + s.id + '\')">ACUSAR</button>' +
      '  </div>' +
      '</div>';
  }).join('');
  var feedbackClass = state.detFeedbackOk === true ? ' ok' : state.detFeedbackOk === false ? ' fail' : '';
  return exitBtn +
    '<div class="game-progress">Caso ' + (state.detIndex + 1) + ' de ' + state.detTotal + ' — Pontuação: ' + state.detScore + '</div>' +
    renderTimerBar() +
    '<div class="game-board">' +
    '  <div class="game-header"><h2>DETETIVE DE ELIMINAÇÃO</h2></div>' +
    '  <div class="game-warning">⚠ Um dos 6 suspeitos abaixo é o verdadeiro culpado deste caso. Use as pistas, elimine quem não bate e acuse o certo antes do tempo acabar.</div>' +
    pistasHtml +
    (showNextClueButton ? '<div class="game-actions"><button class="btn" onclick="App.avancarPistaDet(false)">PEDIR PRÓXIMA PISTA</button></div>' : '') +
    '  <div class="suspect-grid">' + suspeitosHtml + '</div>' +
    '  <div class="game-feedback' + feedbackClass + '">' + App.esc(state.detFeedback) + '</div>' +
    '</div>';
}

function renderGameRV() {
  var exitBtn = '<div class="toolbar"><button class="btn" onclick="App.exitGameRV()">« ABANDONAR RECONHECIMENTO</button></div>';
  if (state.rvFinished) {
    return exitBtn +
      '<div class="game-summary">' +
      '  <h2>RECONHECIMENTO VISUAL ENCERRADO</h2>' +
      '  <p>Você reconheceu corretamente ' + state.rvScore + ' de ' + state.rvTotal + ' rostos.</p>' +
      '  <p class="score">Aproveitamento: ' + Math.round((state.rvScore / state.rvTotal) * 100) + '%</p>' +
      renderPointsGainedLine() +
      '  <button class="btn" style="margin-top:14px;" onclick="App.goToActivities()">VOLTAR ÀS ATIVIDADES</button>' +
      '</div>';
  }
  var c = state.rvCurrent;
  if (!c) return exitBtn + '<p>Carregando rodada...</p>';
  var answered = state.rvFeedback !== '';
  var optionsHtml = c.opcoes.map(function (o) {
    var isGuess = c.guessId === o.id;
    var isTarget = o.id === c.alvoId;
    var cls = 'rv-option';
    if (answered) {
      if (isTarget) cls += ' correct';
      else if (isGuess) cls += ' wrong';
    }
    return '<button class="' + cls + '" ' + (answered ? 'disabled' : '') + ' onclick="App.answerRV(\'' + o.id + '\')">' + App.esc(o.nome) + '</button>';
  }).join('');
  var feedbackClass = state.rvFeedbackOk === true ? ' ok' : state.rvFeedbackOk === false ? ' fail' : '';
  return exitBtn +
    '<div class="game-progress">Rodada ' + (state.rvIndex + 1) + ' de ' + state.rvTotal + ' — Acertos: ' + state.rvScore + '</div>' +
    renderTimerBar() +
    '<div class="game-board">' +
    '  <div class="game-header"><h2>RECONHECIMENTO VISUAL</h2></div>' +
    '  <div class="game-warning" style="background:rgba(0,0,0,.3);border-color:#444;color:#ccc;">Observe o retrato forense abaixo e identifique a lenda correta.</div>' +
    '  <div class="rv-photo-frame"><img src="' + App.esc(c.foto || '') + '" alt="Retrato forense" onerror="this.parentNode.classList.add(\'slot-broken\')"></div>' +
    '  <div class="rv-options">' + optionsHtml + '</div>' +
    '  <div class="game-feedback' + feedbackClass + '">' + App.esc(state.rvFeedback) + '</div>' +
    '</div>';
}

document.addEventListener('DOMContentLoaded', function () { App.init(); });

</script>
</body>
</html>
